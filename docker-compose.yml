    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: order_db
    command: --performance-schema=OFF
    ports:
      - "33065:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    networks:
      - cropdeal-net

  payment-mysql:

networks:
  cropdeal-net:
    driver: bridge

volumes:
  auth-db-data:
  user-db-data:
  crop-db-data:
  price-db-data:
  order-db-data:
  payment-db-data:
  wallet-db-data:
  bidding-db-data:
  delivery-db-data:
  notification-db-data:
  review-db-data:
  report-db-data:
  audit-db-data:
  chatbot-db-data:
  negotiation-db-data:
  invoice-db-data:

services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cropdeal-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - cropdeal-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 14 Isolated MySQL Database Containers (Database-per-Service)
  auth-mysql:
    image: mysql:8.0
    container_name: cropdeal-auth-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
    command: --performance-schema=OFF
    ports:
      - "33061:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - cropdeal-net

  user-mysql:
    image: mysql:8.0
    container_name: cropdeal-user-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: user_db
    command: --performance-schema=OFF
    ports:
      - "33062:3306"
    volumes:
      - user-db-data:/var/lib/mysql
    networks:
      - cropdeal-net

  crop-mysql:
    image: mysql:8.0
    container_name: cropdeal-crop-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: crop_db
    command: --performance-schema=OFF
    ports:
      - "33063:3306"
    volumes:
      - crop-db-data:/var/lib/mysql
    networks:
      - cropdeal-net

  price-mysql:
    image: mysql:8.0
    container_name: cropdeal-price-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: price_db
    command: --performance-schema=OFF
    ports:
      - "33064:3306"
    volumes:
      - price-db-data:/var/lib/mysql
    networks:
      - cropdeal-net

  order-mysql:

  invoice-mysql:
    image: mysql:8.0
    container_name: cropdeal-invoice-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: invoice_db
    command: --performance-schema=OFF
    ports:
      - "33076:3306"
    volumes:
      - invoice-db-data:/var/lib/mysql
    networks:
      - cropdeal-net

  # Core Infrastructure
  config-server:
    build: ./config-server
    container_name: cropdeal-config-server
    ports:
      - "8888:8888"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:+UseSerialGC"
    networks:
      - cropdeal-net

  eureka-server:
    build: ./eureka-server
    container_name: cropdeal-eureka-server
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:+UseSerialGC"
    networks:
      - cropdeal-net
    depends_on:
      - config-server

  api-gateway:
    build: ./api-gateway
    container_name: cropdeal-api-gateway
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:+UseSerialGC"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - cropdeal-net
    depends_on:
      - eureka-server

  # Microservices
  auth-service:
    build: ./auth-service
    container_name: cropdeal-auth-service
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - cropdeal-net
    depends_on:
      - auth-mysql
      - rabbitmq
      - eureka-server

  user-service:

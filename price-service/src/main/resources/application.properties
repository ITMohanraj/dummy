server.port=8084
spring.application.name=price-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:33064/price_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Official Government Agmarknet / data.gov.in Integration
cropdeal.agmarknet.api-url=https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070
cropdeal.agmarknet.api-key=579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b
cropdeal.agmarknet.enabled=true
cropdeal.agmarknet.limit=50

management.endpoints.web.exposure.include=health,info,metrics

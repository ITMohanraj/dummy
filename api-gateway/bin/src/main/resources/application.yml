server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**
        - id: crop-service
          uri: lb://CROP-SERVICE
          predicates:
            - Path=/api/v1/crops/**
        - id: price-service
          uri: lb://PRICE-SERVICE
          predicates:
            - Path=/api/v1/prices/**
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders/**, /api/v1/negotiations/**, /api/v1/invoices/**
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payments/**
        - id: wallet-service
          uri: lb://WALLET-SERVICE
          predicates:
            - Path=/api/v1/wallets/**
        - id: bidding-service
          uri: lb://BIDDING-SERVICE
          predicates:
            - Path=/api/v1/bids/**, /api/v1/auctions/**
        - id: delivery-service
          uri: lb://DELIVERY-SERVICE
          predicates:
            - Path=/api/v1/deliveries/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**
        - id: review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/api/v1/reviews/**
        - id: report-service
          uri: lb://REPORT-SERVICE
          predicates:
            - Path=/api/v1/reports/**
        - id: audit-service
          uri: lb://AUDIT-SERVICE
          predicates:
            - Path=/api/v1/audit/**
        - id: chatbot-service
          uri: lb://CHATBOT-SERVICE
          predicates:
            - Path=/api/v1/chatbot/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

cropdeal:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

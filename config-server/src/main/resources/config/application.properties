# Centralized CropDeal Global Properties
cropdeal.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
cropdeal.jwt.expiration-ms=86400000

# Centralized RabbitMQ Exchanges
cropdeal.rabbitmq.exchange.auth=auth.exchange
cropdeal.rabbitmq.exchange.crop=crop.exchange
cropdeal.rabbitmq.exchange.order=order.exchange
cropdeal.rabbitmq.exchange.payment=payment.exchange
cropdeal.rabbitmq.exchange.wallet=wallet.exchange
cropdeal.rabbitmq.exchange.delivery=delivery.exchange
cropdeal.rabbitmq.exchange.price=price.exchange
cropdeal.rabbitmq.exchange.notification=notification.exchange
cropdeal.rabbitmq.exchange.review=review.exchange
cropdeal.rabbitmq.exchange.audit=audit.exchange
cropdeal.rabbitmq.exchange.bidding=bidding.exchange
cropdeal.rabbitmq.exchange.negotiation=negotiation.exchange
cropdeal.rabbitmq.exchange.invoice=invoice.exchange

# Centralized Eureka & Actuator
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,retries

# Centralized Resilience4j Circuit Breaker Defaults
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

# Centralized Resilience4j Retry Defaults
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2